    "Cairo": {
      "Package": "Cairo",
      "Version": "1.7-0",
      "Source": "Repository",
      "Title": "R Graphics Device using Cairo Graphics Library for Creating High-Quality Bitmap (PNG, JPEG, TIFF), Vector (PDF, SVG, PostScript) and Display (X11 and Win32) Output",
      "Author": "Simon Urbanek [aut, cre, cph] (https://urbanek.org, ORCID: <https://orcid.org/0000-0003-2297-1732>), Jeffrey Horner [aut]",
      "Maintainer": "Simon Urbanek <Simon.Urbanek@r-project.org>",
      "Authors@R": "c(person(\"Simon\", \"Urbanek\", role=c(\"aut\",\"cre\",\"cph\"), email=\"Simon.Urbanek@r-project.org\", comment=c(\"https://urbanek.org\", ORCID=\"0000-0003-2297-1732\")), person(\"Jeffrey\", \"Horner\", role=\"aut\", email=\"jeff.horner@vanderbilt.edu\"))",
      "Depends": [
        "R (>= 2.7.0)"
      ],
      "Imports": [
        "grDevices",
        "graphics"
      ],
      "Suggests": [
        "png"
      ],
      "Enhances": [
        "FastRWeb"
      ],
      "Description": "R graphics device using cairographics library that can be used to create high-quality vector (PDF, PostScript and SVG) and bitmap output (PNG,JPEG,TIFF), and high-quality rendering in displays (X11 and Win32). Since it uses the same back-end for all output, copying across formats is WYSIWYG. Files are created without the dependence on X11 or other external programs. This device supports alpha channel (semi-transparent drawing) and resulting images can contain transparent and semi-transparent regions. It is ideal for use in server environments (file output) and as a replacement for other devices that don't have Cairo's capabilities such as alpha support or anti-aliasing. Backends are modular such that any subset of backends is supported.",
      "License": "GPL-2 | GPL-3",
      "SystemRequirements": "cairo (>= 1.2 http://www.cairographics.org/)",
      "URL": "http://www.rforge.net/Cairo/",
      "NeedsCompilation": "yes",
      "Repository": "CRAN"
    },
    "DALEX": {
      "Package": "DALEX",
      "Version": "2.5.3",
      "Source": "Repository",
      "Title": "moDel Agnostic Language for Exploration and eXplanation",
      "Authors@R": "c(person(\"Przemyslaw\", \"Biecek\", email = \"przemyslaw.biecek@gmail.com\", role = c(\"aut\", \"cre\"),  comment = c(ORCID = \"0000-0001-8423-1823\")), person(\"Szymon\", \"Maksymiuk\", role = \"aut\", comment = c(ORCID = \"0000-0002-3120-1601\")), person(\"Hubert\", \"Baniecki\", role = \"aut\", comment = c(ORCID = \"0000-0001-6661-5364\")))",
      "Description": "Any unverified black box model is the path to failure. Opaqueness leads to distrust.  Distrust leads to ignoration. Ignoration leads to rejection.  DALEX package xrays any model and helps to explore and explain its behaviour. Machine Learning (ML) models are widely used and have various applications in classification  or regression. Models created with boosting, bagging, stacking or similar techniques are often used due to their high performance. But such black-box models usually lack direct interpretability. DALEX package contains various methods that help to understand the link between input variables  and model output. Implemented methods help to explore the model on the level of a single instance  as well as a level of the whole dataset. All model explainers are model agnostic and can be compared across different models. DALEX package is the cornerstone for 'DrWhy.AI' universe of packages for visual model exploration. Find more details in (Biecek 2018) <https://jmlr.org/papers/v19/18-416.html>.",
      "License": "GPL",
      "Encoding": "UTF-8",
      "LazyData": "true",
      "RoxygenNote": "7.3.2",
      "Depends": [
        "R (>= 3.5)"
      ],
      "Imports": [
        "ggplot2",
        "iBreakDown (>= 1.3.1)",
        "ingredients (>= 2.0)",
        "kernelshap"
      ],
      "Suggests": [
        "gower",
        "ranger",
        "testthat",
        "methods"
      ],
      "URL": "https://modeloriented.github.io/DALEX/, https://dalex.drwhy.ai",
      "BugReports": "https://github.com/ModelOriented/DALEX/issues",
      "NeedsCompilation": "no",
      "Author": "Przemyslaw Biecek [aut, cre] (ORCID: <https://orcid.org/0000-0001-8423-1823>), Szymon Maksymiuk [aut] (ORCID: <https://orcid.org/0000-0002-3120-1601>), Hubert Baniecki [aut] (ORCID: <https://orcid.org/0000-0001-6661-5364>)",
      "Maintainer": "Przemyslaw Biecek <przemyslaw.biecek@gmail.com>",
      "Repository": "CRAN"
    },
